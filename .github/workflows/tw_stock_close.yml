name: 台股收盤資料寄送

on:
  # 唯一觸發：cron-job.org 週一到週五 16:25（台北）呼叫 API，或手動執行。
  # 不用 GitHub schedule：負載高時會延遲，排隊的 job 可能被丟掉；公開 repo 60 天沒有活動會被自動停用。
  workflow_dispatch:

concurrency:
  group: tw-stock-close
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - name: 抓資料並寄信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WAIT_MINUTES: "30"
        run: python tw_stock_close.py
      - name: 保留 Excel 7 天（可在 Actions 頁面下載）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-stock-close
          path: tw_stock_close_*.xlsx
          retention-days: 7
