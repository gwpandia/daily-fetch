name: 台股收盤資料寄送

on:
  # 方式 A：GitHub 內建排程（UTC 08:37 = 台北 16:37，週一到週五）。可能延遲 5～30 分鐘。
  schedule:
    - cron: "37 8 * * 1-5"
  # 方式 B：手動或由 cron-job.org 呼叫 API 觸發（時間較準）。兩種擇一，避免一天寄兩封。
  workflow_dispatch:

concurrency:
  group: tw-stock-close
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - name: 抓資料並寄信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WAIT_MINUTES: "30"
        run: python tw_stock_close.py
      - name: 保留 Excel 7 天（可在 Actions 頁面下載）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-stock-close
          path: tw_stock_close_*.xlsx
          retention-days: 7
